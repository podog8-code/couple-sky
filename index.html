<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>情侣空间</title>

  <!-- QQ 分享卡片（部署后把 podog8-code.github.io/couple-sky 换成你的 https 域名） -->
  <meta itemprop="name" content="情侣空间">
  <meta name="description" itemprop="description" content="我想和你一起去光·遇，一起牵手看星星。">
  <meta itemprop="image" content="https://podog8-code.github.io/couple-sky/og-cover.png">
  <meta property="og:title" content="情侣空间">
  <meta property="og:description" content="我想和你一起去光·遇，一起牵手看星星。">
  <meta property="og:image" content="https://podog8-code.github.io/couple-sky/og-cover.png">
  <meta property="og:image:secure_url" content="https://podog8-code.github.io/couple-sky/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <link rel="image_src" href="https://podog8-code.github.io/couple-sky/og-cover.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://podog8-code.github.io/couple-sky/">
  <meta name="theme-color" content="#101c36">

  <style>
    :root {
      --ink: #13203a;
      --muted: rgba(255, 255, 255, 0.82);
      --warm: #ffb26b;
      --rose: #ff7d8a;
      --cream: #fff3e3;
      --panel: rgba(17, 29, 55, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #101c36;
    }

    body {
      color: var(--cream);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);
      background-color: #101c36;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url("og-cover.png");
      background-size: cover;
      background-position: center 28%;
      transform: scale(1.015);
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 15, 34, 0.18) 0%, rgba(8, 15, 34, 0.34) 42%, rgba(10, 18, 39, 0.86) 100%);
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: rgba(255, 243, 227, 0.95);
      font-size: 14px;
      font-weight: 600;
    }

    .brand svg {
      width: 18px;
      height: 18px;
      color: var(--rose);
      filter: drop-shadow(0 0 8px rgba(255, 125, 138, 0.8));
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.18;
      font-weight: 700;
      text-shadow: 0 2px 18px rgba(8, 15, 34, 0.5);
    }

    .subtitle {
      margin: 10px 0 26px;
      max-width: 18em;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      text-shadow: 0 1px 10px rgba(8, 15, 34, 0.55);
    }

    .launcher {
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 46px rgba(5, 10, 26, 0.34);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px;
    }

    .status {
      min-height: 20px;
      margin-bottom: 12px;
      color: rgba(255, 243, 227, 0.9);
      font-size: 13px;
      line-height: 20px;
    }

    .status.error {
      color: #ffc2a3;
    }

    .primary {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff8f6b 0%, #ff6f8e 100%);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(255, 111, 142, 0.34);
      transition: transform 120ms ease, filter 120ms ease;
    }

    .primary:active {
      transform: scale(0.985);
    }

    .primary:hover {
      filter: brightness(1.05);
    }

    .primary svg {
      width: 18px;
      height: 18px;
    }

    .secondary {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 14px;
    }

    .secondary a {
      color: rgba(255, 243, 227, 0.88);
      font-size: 13px;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 243, 227, 0.38);
      padding-bottom: 2px;
    }

    .secondary a:active {
      opacity: 0.72;
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 54px;
        padding-bottom: 54px;
      }

      h1 {
        font-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg" role="img" aria-label="云端之上一对光之后裔并肩而行"></div>
    <div class="shade"></div>
    <main>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
        情侣空间
      </div>
      <h1>光是遇见就很美好</h1>
      <p class="subtitle">带上 TA，去云海之上一起看星星。</p>

      <section class="launcher" aria-label="打开光遇">
        <div class="status" id="status" role="status">正在连接光·遇…</div>
        <button class="primary" id="launchBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 3l14 9-14 9V3z"/>
          </svg>
          打开光·遇
        </button>
        <div class="secondary">
          <a href="https://adl.netease.com/d/g/sky/c/gw" id="downloadLink">下载光·遇</a>
          <a href="https://nie.res.netease.com/comm/gamestart/index.html#id=sky" id="bridgeLink">官方启动页</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var CONFIG = {
        androidSchemes: [
          "ntes://game.mobile/game75/",
          "ntes://game.mobile/ma75./"
        ],
        iosUniversal: "https://game.163.com/open/sky/",
        download: "https://adl.netease.com/d/g/sky/c/gw",
        bridge: "https://nie.res.netease.com/comm/gamestart/index.html#id=sky"
      };

      var statusEl = document.getElementById("status");
      var launchBtn = document.getElementById("launchBtn");
      var ua = navigator.userAgent.toLowerCase();
      var isAndroid = /android/i.test(ua);
      var isIOS = /iphone|ipad|ipod/i.test(ua);
      var inQQ = /mqq|qq\//i.test(ua);
      var preview = /[?&]preview=1/.test(location.search);
      var launched = false;
      var schemeTimer = null;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      function clearSchemeTimer() {
        if (schemeTimer) {
          clearTimeout(schemeTimer);
          schemeTimer = null;
        }
      }

      function go(url) {
        try {
          window.location.replace(url);
        } catch (e) {
          window.location.href = url;
        }
      }

      function downloadFallback() {
        clearSchemeTimer();
        if (inQQ) {
          setStatus("QQ 已拦截跳转，请点右上角在浏览器打开", true);
          launched = false;
          return;
        }
        if (isAndroid || isIOS) {
          setStatus("请点按钮打开光·遇", true);
          launched = false;
          return;
        }
        setStatus("正在前往下载页…");
        go(CONFIG.download);
      }

      function tryAndroidScheme() {
        var start = Date.now();
        var opened = false;

        function markOpened() {
          opened = true;
          clearSchemeTimer();
        }

        window.addEventListener("blur", markOpened);
        document.addEventListener("visibilitychange", markOpened);

        var scheme = CONFIG.androidSchemes[0];
        try {
          window.location.href = scheme;
        } catch (e) {
          window.removeEventListener("blur", markOpened);
          document.removeEventListener("visibilitychange", markOpened);
          downloadFallback();
          return;
        }

        schemeTimer = setTimeout(function () {
          window.removeEventListener("blur", markOpened);
          document.removeEventListener("visibilitychange", markOpened);
          if (!opened) {
            downloadFallback();
          }
        }, 3500);
      }

      function launch(auto) {
        if (launched) {
          return;
        }
        if (preview && auto) {
          setStatus("预览模式");
          return;
        }
        launched = true;
        setStatus("正在连接光·遇…");

        if (isAndroid) {
          tryAndroidScheme();
        } else if (isIOS) {
          go(CONFIG.iosUniversal);
        } else {
          go(CONFIG.download);
        }
      }

      launchBtn.addEventListener("click", function () {
        launch(false);
      });

      if (isAndroid || isIOS) {
        setTimeout(function () {
          launch(true);
        }, 260);
      } else {
        setStatus("请用手机打开此链接", true);
      }
    })();
  </script>
</body>
</html>
